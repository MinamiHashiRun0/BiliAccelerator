# BiliAccelerator dylib — GitHub Actions 云端编译（无需本地 Mac）
# 产物：build/BiliAccelerator.dylib（arm64 iOS）

name: build-dylib

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests (host macOS, no device needed)
        run: |
          mkdir -p build
          clang -fobjc-arc -O1 -framework Foundation \
            -DBA_NO_CONSTRUCTOR \
            tests/test_logic.m -o build/test_logic
          ./build/test_logic

  build:
    needs: test
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Compile dylib (arm64 iOS)
        run: |
          mkdir -p build
          xcrun -sdk iphoneos clang \
            -arch arm64 \
            -miphoneos-version-min=13.0 \
            -shared \
            -fobjc-arc \
            -O2 \
            -framework Foundation \
            -o BiliAccelerator.dylib \
            src/Tweak.m
          file BiliAccelerator.dylib

      - name: Install ldid
        run: brew install ldid

      - name: Fake-sign dylib
        run: |
          mkdir -p build
          ldid -S BiliAccelerator.dylib
          codesign -dv BiliAccelerator.dylib || true
          mkdir -p build
          cp BiliAccelerator.dylib build/

      - name: Upload dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: BiliAccelerator.dylib
          path: build/BiliAccelerator.dylib

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          files: build/BiliAccelerator.dylib
          fail_on_unmatched_files: true
          body: |
            BiliAccelerator.dylib v0.1.0
            - arm64 iOS 13+ 免越狱注入 dylib
            - 用 tools/repack.py 注入到脱壳 IPA
